name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/tinkerfin-ai/sandbox-runtime

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load locked versions
        run: cat versions.env >>"${GITHUB_ENV}"
      - name: Validate release tag and record metadata
        shell: bash
        run: |
          release_version=${GITHUB_REF_NAME#v}
          if [[ ! ${release_version} =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'invalid release tag: %s\n' "${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          {
            printf 'RELEASE_VERSION=%s\n' "${release_version}"
            printf 'BUILD_DATE=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'VCS_REF=%s\n' "${GITHUB_SHA}"
          } >>"${GITHUB_ENV}"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish OCI index
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            RUNTIME_VERSION=${{ env.RELEASE_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            JAVA_VERSION=${{ env.JAVA_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            NPM_VERSION=${{ env.NPM_VERSION }}
            GO_VERSION=${{ env.GO_VERSION }}
            MAVEN_VERSION=${{ env.MAVEN_VERSION }}
            NODE_SHA256_AMD64=${{ env.NODE_SHA256_AMD64 }}
            NODE_SHA256_ARM64=${{ env.NODE_SHA256_ARM64 }}
            NPM_SHA512=${{ env.NPM_SHA512 }}
            GO_SHA256_AMD64=${{ env.GO_SHA256_AMD64 }}
            GO_SHA256_ARM64=${{ env.GO_SHA256_ARM64 }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ env.VCS_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      - name: Scan published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
      - name: Record immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf "### Published image\n\n\`%s@%s\`\n" \
            "${IMAGE_NAME}" "${DIGEST}" >>"${GITHUB_STEP_SUMMARY}"
