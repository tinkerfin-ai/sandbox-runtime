name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/tinkerfin-ai/sandbox-runtime

jobs:
  build:
    name: Build and scan (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load locked versions
        run: cat versions.env >>"${GITHUB_ENV}"
      - name: Validate release tag and record metadata
        shell: bash
        run: |
          release_version=${GITHUB_REF_NAME#v}
          if [[ ! ${release_version} =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'invalid release tag: %s\n' "${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [[ ${release_version} != "${RUNTIME_VERSION}" ]]; then
            printf 'release tag %s does not match runtime version %s\n' \
              "${release_version}" "${RUNTIME_VERSION}" >&2
            exit 1
          fi
          {
            printf 'RELEASE_VERSION=%s\n' "${release_version}"
            printf 'BUILD_DATE=%s\n' "$(git show -s --format=%cI "${GITHUB_SHA}")"
            printf 'VCS_REF=%s\n' "${GITHUB_SHA}"
          } >>"${GITHUB_ENV}"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite exact version tag
        run: |
          if tag_result=$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${RELEASE_VERSION}" 2>&1); then
            printf 'exact version tag already exists: %s:%s\n' \
              "${IMAGE_NAME}" "${RELEASE_VERSION}" >&2
            exit 1
          elif [[ ${tag_result} != *': not found'* \
              && ${tag_result} != *'manifest unknown'* ]]; then
            printf 'unable to verify exact version tag: %s\n' "${tag_result}" >&2
            exit 1
          fi
      - name: Generate image labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=semver,pattern={{version}}
      - name: Build and push platform digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            RUNTIME_VERSION=${{ env.RELEASE_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            JAVA_VERSION=${{ env.JAVA_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            NPM_VERSION=${{ env.NPM_VERSION }}
            GO_VERSION=${{ env.GO_VERSION }}
            MAVEN_VERSION=${{ env.MAVEN_VERSION }}
            SETUPTOOLS_VERSION=${{ env.SETUPTOOLS_VERSION }}
            NPM_BRACE_EXPANSION_VERSION=${{ env.NPM_BRACE_EXPANSION_VERSION }}
            NPM_IP_ADDRESS_VERSION=${{ env.NPM_IP_ADDRESS_VERSION }}
            NODE_SHA256_AMD64=${{ env.NODE_SHA256_AMD64 }}
            NODE_SHA256_ARM64=${{ env.NODE_SHA256_ARM64 }}
            NPM_SHA512=${{ env.NPM_SHA512 }}
            NPM_BRACE_EXPANSION_SHA512=${{ env.NPM_BRACE_EXPANSION_SHA512 }}
            NPM_IP_ADDRESS_SHA512=${{ env.NPM_IP_ADDRESS_SHA512 }}
            SETUPTOOLS_SHA256=${{ env.SETUPTOOLS_SHA256 }}
            GO_SHA256_AMD64=${{ env.GO_SHA256_AMD64 }}
            GO_SHA256_ARM64=${{ env.GO_SHA256_ARM64 }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ env.VCS_REF }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Pull exact platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull --platform "${{ matrix.platform }}" "${IMAGE_NAME}@${DIGEST}"
      - name: Run runtime smoke test
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: ./tests/runtime-smoke.sh "${IMAGE_NAME}@${DIGEST}"
      - name: Report high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          exit-code: "0"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          version: v0.70.0
      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          version: v0.70.0
      - name: Export image digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${ARCH}-${DIGEST#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish OCI index
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load locked versions
        run: cat versions.env >>"${GITHUB_ENV}"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create and publish OCI index
        id: index
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        shell: bash
        run: |
          if tag_result=$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${RUNTIME_VERSION}" 2>&1); then
            printf 'exact version tag already exists: %s:%s\n' \
              "${IMAGE_NAME}" "${RUNTIME_VERSION}" >&2
            exit 1
          elif [[ ${tag_result} != *': not found'* \
              && ${tag_result} != *'manifest unknown'* ]]; then
            printf 'unable to verify exact version tag: %s\n' "${tag_result}" >&2
            exit 1
          fi

          tag_args=()
          while IFS= read -r tag; do
            [[ -n ${tag} ]] && tag_args+=(--tag "${tag}")
          done <<<"${TAGS}"
          if [[ ${#tag_args[@]} -eq 0 ]]; then
            printf 'no release tags were generated\n' >&2
            exit 1
          fi

          digest_refs=()
          while IFS= read -r digest_file; do
            digest_name=$(basename "${digest_file}")
            if [[ ! ${digest_name} =~ ^(amd64|arm64)-([0-9a-f]{64})$ ]]; then
              printf 'invalid platform digest file: %s\n' "${digest_name}" >&2
              exit 1
            fi
            platform_arch=${BASH_REMATCH[1]}
            platform_digest=${BASH_REMATCH[2]}
            digest_ref="${IMAGE_NAME}@sha256:${platform_digest}"
            inspect_json=$(docker buildx imagetools inspect \
              "${digest_ref}" --format '{{json .}}')
            if ! jq --exit-status --arg expected "linux/${platform_arch}" '
              ([.manifest.manifests[]?.platform
                | select(.os == "linux")
                | "\(.os)/\(.architecture)"] | unique | sort) == [$expected]
              ' <<<"${inspect_json}" >/dev/null; then
              printf 'unexpected candidate platforms for %s\n' "${digest_ref}" >&2
              exit 1
            fi
            digest_refs+=("${digest_ref}")
          done < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f -print | sort)
          if [[ ${#digest_refs[@]} -ne 2 ]]; then
            printf 'expected two platform digests, found %s\n' "${#digest_refs[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${digest_refs[@]}"
          manifest_json=$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${RUNTIME_VERSION}" --format '{{json .Manifest}}')
          manifest_digest=$(jq -r '.digest' <<<"${manifest_json}")
          if [[ ! ${manifest_digest} =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'invalid OCI index digest: %s\n' "${manifest_digest}" >&2
            exit 1
          fi
          if ! jq --exit-status '
            ([.manifests[]?.platform
              | select(.os == "linux")
              | "\(.os)/\(.architecture)"] | unique | sort)
              == ["linux/amd64", "linux/arm64"]
            ' <<<"${manifest_json}" >/dev/null; then
            printf 'unexpected OCI index platforms\n' >&2
            exit 1
          fi
          printf 'digest=%s\n' "${manifest_digest}" >>"${GITHUB_OUTPUT}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign published digest
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      - name: Verify anonymous image access
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          anonymous_docker_config=$(mktemp -d)
          trap 'rm -rf -- "${anonymous_docker_config}"' EXIT
          for attempt in {1..10}; do
            if docker --config "${anonymous_docker_config}" buildx imagetools inspect \
              "${IMAGE_NAME}@${DIGEST}" >/dev/null; then
              exit 0
            fi
            printf 'anonymous pull check attempt %s failed; retrying\n' "${attempt}" >&2
            sleep 2
          done
          exit 1
      - name: Record immutable digest
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          printf "### Published image\n\n\`%s@%s\`\n" \
            "${IMAGE_NAME}" "${DIGEST}" >>"${GITHUB_STEP_SUMMARY}"
