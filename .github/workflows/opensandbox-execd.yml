name: OpenSandbox Execd

on:
  pull_request:
    paths:
      - opensandbox-execd/**
      - Makefile
      - .github/workflows/opensandbox-execd.yml
  push:
    branches:
      - main
    tags:
      - execd-v*.*.*
    paths:
      - opensandbox-execd/**
      - Makefile
      - .github/workflows/opensandbox-execd.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opensandbox-execd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/tinkerfin-ai/opensandbox-execd
  EXECD_RUNTIME_IMAGE: ghcr.io/tinkerfin-ai/sandbox-runtime:0.1.2

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate architecture and release
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "${EXPECTED_ARCH}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) printf 'unexpected runner architecture\n' >&2; exit 1 ;;
          esac
          source opensandbox-execd/versions.env
          if [[ ${GITHUB_REF} == refs/tags/* && ${GITHUB_REF_NAME} != "execd-v${EXECD_VERSION}" ]]; then
            printf 'tag does not match EXECD_VERSION\n' >&2
            exit 1
          fi
          cat opensandbox-execd/versions.env >>"${GITHUB_ENV}"
          printf 'TEST_RUN_ID=%s\n' "$(python3 -c 'from uuid import uuid4; print(uuid4().hex)')" >>"${GITHUB_ENV}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/execd-v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite exact version tag
        if: startsWith(github.ref, 'refs/tags/execd-v')
        run: |
          if result=$(docker buildx imagetools inspect "${IMAGE_NAME}:${EXECD_VERSION}" 2>&1); then
            printf 'exact version tag already exists\n' >&2
            exit 1
          elif [[ ${result} != *': not found'* && ${result} != *'manifest unknown'* ]]; then
            printf '%s\n' "${result}" >&2
            exit 1
          fi
      - name: Build candidate
        if: "!startsWith(github.ref, 'refs/tags/execd-v')"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: opensandbox-execd/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: opensandbox-execd:test-${{ env.TEST_RUN_ID }}
          labels: io.tinkerfin.execd-test=${{ env.TEST_RUN_ID }}
          build-args: |
            EXECD_VERSION=${{ env.EXECD_VERSION }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=execd-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=execd-${{ matrix.arch }}
      - name: Build and push platform digest
        if: startsWith(github.ref, 'refs/tags/execd-v')
        id: release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: opensandbox-execd/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            EXECD_VERSION=${{ env.EXECD_VERSION }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=execd-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=execd-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Select exact test images
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          test_image="opensandbox-execd:test-${TEST_RUN_ID}"
          if [[ ${GITHUB_REF} == refs/tags/execd-v* ]]; then
            [[ ${DIGEST} =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            test_image="${IMAGE_NAME}@${DIGEST}"
            if ! docker image inspect "${test_image}" >/dev/null 2>&1; then
              printf 'OWNED_VERIFICATION_IMAGE=%s\n' "${test_image}" >>"${GITHUB_ENV}"
            fi
            docker pull --platform "${{ matrix.platform }}" "${test_image}"
          fi
          printf 'TEST_IMAGE=%s\n' "${test_image}" >>"${GITHUB_ENV}"
          if ! docker image inspect "${EXECD_RUNTIME_IMAGE}" >/dev/null 2>&1; then
            printf 'OWNED_RUNTIME_IMAGE=%s\n' "${EXECD_RUNTIME_IMAGE}" >>"${GITHUB_ENV}"
            docker pull --platform "${{ matrix.platform }}" "${EXECD_RUNTIME_IMAGE}"
          fi
      - name: Verify native sessions, file confinement and signal cleanup
        run: make execd-test EXECD_IMAGE="${TEST_IMAGE}" EXECD_RUNTIME_IMAGE="${EXECD_RUNTIME_IMAGE}"
      - name: Report high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          exit-code: "0"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          version: v0.70.0
      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          version: v0.70.0
      - name: Export platform digest
        if: startsWith(github.ref, 'refs/tags/execd-v')
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/execd-digests"
          touch "${RUNNER_TEMP}/execd-digests/${{ matrix.arch }}-${DIGEST#sha256:}"
      - name: Upload platform digest
        if: startsWith(github.ref, 'refs/tags/execd-v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: execd-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/execd-digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Remove locally pulled test images
        if: always()
        env:
          OWNED_VERIFICATION_IMAGE: ${{ env.OWNED_VERIFICATION_IMAGE }}
          OWNED_RUNTIME_IMAGE: ${{ env.OWNED_RUNTIME_IMAGE }}
        run: |
          for image in "${OWNED_VERIFICATION_IMAGE}" "${OWNED_RUNTIME_IMAGE}"; do
            [[ -n ${image} ]] || continue
            if docker image inspect "${image}" >/dev/null 2>&1; then
              docker image rm "${image}"
            fi
            if docker image inspect "${image}" >/dev/null 2>&1; then
              exit 1
            fi
          done
      - name: Remove candidate image
        if: always() && env.TEST_RUN_ID != ''
        run: |
          candidate="opensandbox-execd:test-${TEST_RUN_ID}"
          if docker image inspect "${candidate}" >/dev/null 2>&1; then
            owner=$(docker image inspect --format '{{index .Config.Labels "io.tinkerfin.execd-test"}}' "${candidate}")
            [[ ${owner} == "${TEST_RUN_ID}" ]] || exit 1
            docker image rm "${candidate}"
          fi
          if docker image inspect "${candidate}" >/dev/null 2>&1; then
            exit 1
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/execd-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cat opensandbox-execd/versions.env >>"${GITHUB_ENV}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: ${{ runner.temp }}/execd-digests
          pattern: execd-digest-*
          merge-multiple: true
      - name: Publish OCI index
        id: index
        shell: bash
        run: |
          if result=$(docker buildx imagetools inspect "${IMAGE_NAME}:${EXECD_VERSION}" 2>&1); then
            printf 'exact version tag already exists\n' >&2
            exit 1
          elif [[ ${result} != *': not found'* && ${result} != *'manifest unknown'* ]]; then
            printf '%s\n' "${result}" >&2
            exit 1
          fi
          anonymous_config=$(mktemp -d)
          trap 'rm -rf -- "${anonymous_config}"' EXIT
          digest_refs=()
          for arch in amd64 arm64; do
            matches=("${RUNNER_TEMP}/execd-digests/${arch}-"*)
            [[ ${#matches[@]} == 1 && -f ${matches[0]} ]] || exit 1
            digest_name=$(basename "${matches[0]}")
            digest=${digest_name#"${arch}"-}
            [[ ${digest} =~ ^[0-9a-f]{64}$ ]] || exit 1
            candidate="${IMAGE_NAME}@sha256:${digest}"
            manifest=$(docker --config "${anonymous_config}" buildx imagetools inspect "${candidate}" --format '{{json .Manifest}}')
            jq --exit-status --arg expected "linux/${arch}" \
              '([.manifests[]?.platform | select(.os == "linux") | "\(.os)/\(.architecture)"] | unique) == [$expected]' <<<"${manifest}"
            digest_refs+=("${candidate}")
          done
          docker buildx imagetools create --tag "${IMAGE_NAME}:${EXECD_VERSION}" "${digest_refs[@]}"
          manifest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${EXECD_VERSION}" --format '{{json .Manifest}}')
          jq --exit-status '([.manifests[]?.platform | select(.os == "linux") | "\(.os)/\(.architecture)"] | unique | sort) == ["linux/amd64", "linux/arm64"]' <<<"${manifest}"
          digest=$(jq -r .digest <<<"${manifest}")
          [[ ${digest} =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          printf 'digest=%s\n' "${digest}" >>"${GITHUB_OUTPUT}"
          printf '%s@%s\n' "${IMAGE_NAME}" "${digest}" >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign published digest
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      - name: Verify anonymous image access
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf -- "${anonymous_config}"' EXIT
          docker --config "${anonymous_config}" buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}"
