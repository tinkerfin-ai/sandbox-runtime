name: OpenSandbox Server

on:
  pull_request:
    paths:
      - opensandbox-server/**
      - tests/server-*
      - Makefile
      - .github/workflows/opensandbox-server.yml
  push:
    branches:
      - main
    tags:
      - server-v*.*.*
    paths:
      - opensandbox-server/**
      - tests/server-*
      - Makefile
      - .github/workflows/opensandbox-server.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opensandbox-server-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/tinkerfin-ai/opensandbox-server

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate architecture and release
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "${EXPECTED_ARCH}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) exit 1 ;;
          esac
          source opensandbox-server/versions.env
          if [[ ${GITHUB_REF} == refs/tags/* && ${GITHUB_REF_NAME} != "server-v${SERVER_VERSION}" ]]; then
            printf 'tag does not match SERVER_VERSION\n' >&2
            exit 1
          fi
          cat opensandbox-server/versions.env >>"${GITHUB_ENV}"
          printf 'TEST_RUN_ID=%s\n' "$(python3 -c 'from uuid import uuid4; print(uuid4().hex)')" >>"${GITHUB_ENV}"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: opensandbox-server/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: opensandbox-server:test-${{ env.TEST_RUN_ID }}
          labels: io.tinkerfin.server-test=${{ env.TEST_RUN_ID }}
          build-args: |
            SERVER_VERSION=${{ env.SERVER_VERSION }}
            VCS_REF=${{ github.sha }}
      - name: Verify server provisioning
        run: make server-test SERVER_IMAGE="opensandbox-server:test-${TEST_RUN_ID}"
      - name: Report high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: opensandbox-server:test-${{ env.TEST_RUN_ID }}
          exit-code: "0"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          version: v0.70.0
      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: opensandbox-server:test-${{ env.TEST_RUN_ID }}
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          version: v0.70.0
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/server-v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push platform digest
        if: startsWith(github.ref, 'refs/tags/server-v')
        id: release
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: opensandbox-server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SERVER_VERSION=${{ env.SERVER_VERSION }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Verify published platform digest
        if: startsWith(github.ref, 'refs/tags/server-v')
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          release_ref="${IMAGE_NAME}@${DIGEST}"
          if ! docker image inspect "${release_ref}" >/dev/null 2>&1; then
            printf 'OWNED_VERIFICATION_IMAGE=%s\n' "${release_ref}" >>"${GITHUB_ENV}"
          fi
          docker pull --platform "${{ matrix.platform }}" "${release_ref}"
          make server-test SERVER_IMAGE="${IMAGE_NAME}@${DIGEST}"
          mkdir -p "${RUNNER_TEMP}/server-digests"
          touch "${RUNNER_TEMP}/server-digests/${{ matrix.arch }}-${DIGEST#sha256:}"
      - name: Block vulnerabilities in the exact published digest
        if: startsWith(github.ref, 'refs/tags/server-v')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.release.outputs.digest }}
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          version: v0.70.0
      - name: Upload platform digest
        if: startsWith(github.ref, 'refs/tags/server-v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/server-digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Remove locally pulled verification image
        if: always() && env.OWNED_VERIFICATION_IMAGE != ''
        run: |
          if docker image inspect "${OWNED_VERIFICATION_IMAGE}" >/dev/null 2>&1; then
            docker image rm "${OWNED_VERIFICATION_IMAGE}"
          fi
          if docker image inspect "${OWNED_VERIFICATION_IMAGE}" >/dev/null 2>&1; then
            exit 1
          fi
      - name: Remove test image
        if: always() && env.TEST_RUN_ID != ''
        run: |
          candidate="opensandbox-server:test-${TEST_RUN_ID}"
          if docker image inspect "${candidate}" >/dev/null 2>&1; then
            owner=$(docker image inspect --format '{{index .Config.Labels "io.tinkerfin.server-test"}}' "${candidate}")
            [[ ${owner} == "${TEST_RUN_ID}" ]] || exit 1
            docker image rm "${candidate}"
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/server-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cat opensandbox-server/versions.env >>"${GITHUB_ENV}"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/server-digests
          pattern: server-digest-*
          merge-multiple: true
      - name: Publish OCI index
        id: index
        shell: bash
        run: |
          if result=$(docker buildx imagetools inspect "${IMAGE_NAME}:${SERVER_VERSION}" 2>&1); then
            printf 'exact version tag already exists\n' >&2
            exit 1
          elif [[ ${result} != *': not found'* && ${result} != *'manifest unknown'* ]]; then
            printf '%s\n' "${result}" >&2
            exit 1
          fi
          digest_refs=()
          for arch in amd64 arm64; do
            matches=("${RUNNER_TEMP}/server-digests/${arch}-"*)
            [[ ${#matches[@]} == 1 && -f ${matches[0]} ]] || exit 1
            digest_name=$(basename "${matches[0]}")
            digest=${digest_name#"${arch}"-}
            [[ ${digest} =~ ^[0-9a-f]{64}$ ]] || exit 1
            digest_refs+=("${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create --tag "${IMAGE_NAME}:${SERVER_VERSION}" "${digest_refs[@]}"
          manifest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${SERVER_VERSION}" --format '{{json .Manifest}}')
          jq --exit-status '([.manifests[]?.platform | select(.os == "linux") | "\(.os)/\(.architecture)"] | unique | sort) == ["linux/amd64", "linux/arm64"]' <<<"${manifest}"
          digest=$(jq -r .digest <<<"${manifest}")
          [[ ${digest} =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          printf 'digest=%s\n' "${digest}" >>"${GITHUB_OUTPUT}"
          printf '%s@%s\n' "${IMAGE_NAME}" "${digest}" >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign published digest
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      - name: Verify anonymous image access
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf -- "${anonymous_config}"' EXIT
          docker --config "${anonymous_config}" buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}"
